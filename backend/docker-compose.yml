version: '3.8'

services:
  shara_db:
    image: postgres:16-alpine
    container_name: shara_postgres_banco
    restart: always
    environment:
      POSTGRES_DB: shara_ef_db
      POSTGRES_USER: sara_admin
      POSTGRES_PASSWORD: ${DB_SENHA:-sara_segura_vps_2026}
    volumes:
      - shara_postgres_dados:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - shara_rede_interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sara_admin -d shara_ef_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  shara_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shara_api_servidor
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://sara_admin:${DB_SENHA:-sara_segura_vps_2026}@shara_db:5432/shara_ef_db
      JWT_SECRET: ${JWT_SECRET:-chave_jwt_shara_ef_producao_2026}
      ORIGEM_PERMITIDA: "*"
    networks:
      - shara_rede_interna
      - nginx-proxy_default
    depends_on:
      shara_db:
        condition: service_healthy

networks:
  shara_rede_interna:
    driver: bridge
  nginx-proxy_default:
    external: true

volumes:
  shara_postgres_dados:
    name: shara_postgres_dados
