version: '3.8'

services:
  shara_db:
    image: postgres:16-alpine
    container_name: shara_banco_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shara_ef_db}
      POSTGRES_USER: ${POSTGRES_USER:-sara_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha_segura_vps_2026}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sara_admin} -d ${POSTGRES_DB:-shara_ef_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  shara_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shara_api_servidor
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-sara_admin}:${POSTGRES_PASSWORD:-senha_segura_vps_2026}@shara_db:5432/${POSTGRES_DB:-shara_ef_db}
      JWT_SECRET: ${JWT_SECRET:-chave_secreta_shara_ef_jwt_2026}
      ORIGEM_PERMITIDA: ${ORIGEM_PERMITIDA:-https://shara-fit.vercel.app}
    ports:
      - "3001:3001"
    depends_on:
      shara_db:
        condition: service_healthy

volumes:
  dados_postgres:
    name: shara_ef_dados_postgres
